<svg xmlns="http://www.w3.org/2000/svg" width="420" height="390" viewBox="0 0 420 390">
  <rect width="420" height="390" fill="white"/>

  <!-- Definiciones -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#000"/>
    </marker>
  </defs>

  <!-- Parámetros visuales:
       origen (120,330), escala 45 px por unidad -->
  <!-- Cuadrícula punteada -->
  <g stroke="#777" stroke-width="1.4" stroke-dasharray="6 5" fill="none">
    <!-- verticales x=-2,-1,1,2,3,4 -->
    <line x1="30"  y1="60" x2="30"  y2="330"/>
    <line x1="75"  y1="60" x2="75"  y2="330"/>
    <line x1="165" y1="60" x2="165" y2="330"/>
    <line x1="210" y1="60" x2="210" y2="330"/>
    <line x1="255" y1="60" x2="255" y2="330"/>
    <line x1="300" y1="60" x2="300" y2="330"/>
    <!-- horizontales y=1..6 -->
    <line x1="30" y1="285" x2="300" y2="285"/>
    <line x1="30" y1="240" x2="300" y2="240"/>
    <line x1="30" y1="195" x2="300" y2="195"/>
    <line x1="30" y1="150" x2="300" y2="150"/>
    <line x1="30" y1="105" x2="300" y2="105"/>
    <line x1="30" y1="60"  x2="300" y2="60"/>
  </g>

  <!-- Ejes -->
  <g stroke="#000" stroke-width="2.2" fill="none">
    <line x1="15" y1="330" x2="390" y2="330" marker-end="url(#arrow)"/>
    <line x1="120" y1="355" x2="120" y2="20" marker-end="url(#arrow)"/>
  </g>

  <!-- Marcas de los ejes -->
  <g stroke="#000" stroke-width="2">
    <!-- x -->
    <line x1="30" y1="324" x2="30" y2="336"/>
    <line x1="75" y1="324" x2="75" y2="336"/>
    <line x1="165" y1="324" x2="165" y2="336"/>
    <line x1="210" y1="324" x2="210" y2="336"/>
    <line x1="255" y1="324" x2="255" y2="336"/>
    <line x1="300" y1="324" x2="300" y2="336"/>
    <!-- y -->
    <line x1="114" y1="285" x2="126" y2="285"/>
    <line x1="114" y1="240" x2="126" y2="240"/>
    <line x1="114" y1="195" x2="126" y2="195"/>
    <line x1="114" y1="150" x2="126" y2="150"/>
    <line x1="114" y1="105" x2="126" y2="105"/>
    <line x1="114" y1="60" x2="126" y2="60"/>
  </g>

  <!-- Números -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000">
    <!-- eje x -->
    <text x="20" y="354">−2</text>
    <text x="68" y="354">−1</text>
    <text x="160" y="354">1</text>
    <text x="205" y="354">2</text>
    <text x="250" y="354">3</text>
    <text x="295" y="354">4</text>

    <!-- eje y: ligeramente por encima de la línea punteada como pediste -->
    <text x="97" y="280">1</text>
    <text x="97" y="235">2</text>
    <text x="97" y="190">3</text>
    <text x="97" y="145">4</text>
    <text x="97" y="100">5</text>
    <text x="97" y="55">6</text>
  </g>

  <!-- Circunferencia c: centro (2,3), radio 2 -->
  <circle cx="210" cy="195" r="90" fill="none" stroke="#000" stroke-width="3"/>

  <!-- Centro -->
  <circle cx="210" cy="195" r="4.5" fill="#000"/>

  <!-- Etiquetas -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#000">
    <text x="396" y="330" font-size="22" font-family="Arial, Helvetica, sans-serif" dominant-baseline="middle">x</text>
    <text x="120" y="10" font-size="22" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">y</text>
    <text x="218" y="218" font-size="20">O</text>
    <!-- c un poco arriba de la línea punteada y=5 -->
    <text x="220" y="98" font-size="20">c</text>
  </g>
</svg>