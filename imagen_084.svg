<svg xmlns="http://www.w3.org/2000/svg" width="390" height="250" viewBox="0 0 390 250">
<rect width="100%" height="100%" fill="white"/>
<defs>
 <marker id="axD" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
   <path d="M0,0 L7,3.5 L0,7 Z" fill="#000"/>
 </marker>
 <marker id="lnD" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto-start-reverse">
   <path d="M0,0 L7,3.5 L0,7 Z" fill="#000"/>
 </marker>
</defs>
<style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#000}
 .axis{stroke:#000;stroke-width:2;fill:none}
 .fn{stroke:#000;stroke-width:2.55;fill:none}
 .pt{fill:#000}
</style>

<!-- Eje x -->
<line class="axis" x1="60" y1="150" x2="365" y2="150" marker-end="url(#axD)"/>
<text x="378" y="156" font-size="20">x</text>

<!-- Eje y -->
<line class="axis" x1="150" y1="218" x2="150" y2="38" marker-end="url(#axD)"/>
<text x="150" y="25" text-anchor="middle" font-size="20">y</text>

<!-- Recta decreciente. La punta derecha queda bastante por debajo
     de la punta del eje x, de modo que no pueden tocarse. -->
<line class="fn" x1="72" y1="58" x2="335" y2="196"
      marker-start="url(#lnD)" marker-end="url(#lnD)"/>

<!-- Puntos destacados -->
<circle class="pt" cx="150" cy="99" r="4.6"/>
<circle class="pt" cx="247" cy="150" r="4.6"/>

<!-- Etiquetas separadas de los segmentos -->
<text x="160" y="94" font-size="18">2</text>
<text x="247" y="176" text-anchor="middle" font-size="18">4</text>
</svg>