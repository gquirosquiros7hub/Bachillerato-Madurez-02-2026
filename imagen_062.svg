<svg xmlns="http://www.w3.org/2000/svg" width="390" height="260" viewBox="0 0 390 260">
<defs>
  <marker id="arrA36" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#000"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#000}
  .axis{stroke:#000;stroke-width:2.2;fill:none}
  .shape{stroke:#000;stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .dash{stroke:#000;stroke-width:1.5;stroke-dasharray:6 5;fill:none}
  .pt{fill:#000}
</style>

<!-- A) -->
<!-- ejes -->
<line class="axis" x1="105" y1="178" x2="350" y2="178" marker-end="url(#arrA36)"/>
<line class="axis" x1="195" y1="230" x2="195" y2="34" marker-end="url(#arrA36)"/>

<!-- letras de los ejes, como en la imagen -->
<text x="195" y="22" font-size="20" text-anchor="middle">y</text>
<text x="358" y="184" font-size="20">x</text>

<!-- guías punteadas -->
<line class="dash" x1="155" y1="82" x2="285" y2="82"/>
<line class="dash" x1="155" y1="82" x2="155" y2="178"/>
<line class="dash" x1="285" y1="82" x2="285" y2="178"/>

<!-- V: (-1,3) -> (1,0) -> (2,3) -->
<polyline class="shape" points="155,82 240,178 285,82"/>
<circle class="pt" cx="155" cy="82" r="6"/>
<circle class="pt" cx="240" cy="178" r="6"/>
<circle class="pt" cx="285" cy="82" r="6"/>

<!-- números exactamente en la disposición de la referencia -->
<text x="186" y="76" font-size="19" text-anchor="end">3</text>
<text x="151" y="203" font-size="18" text-anchor="end">−1</text>
<text x="240" y="204" font-size="18" text-anchor="middle">1</text>
<text x="285" y="204" font-size="18" text-anchor="middle">2</text>
</svg>