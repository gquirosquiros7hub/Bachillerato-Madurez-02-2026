
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="330" viewBox="0 0 560 330">
<rect width="100%" height="100%" fill="white"/>
<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#000"/>
  </marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#000}
.axis{stroke:#000;stroke-width:2.2;fill:none}
.shape{stroke:#000;stroke-width:2.7;fill:none}
.dash{stroke:#000;stroke-width:1.3;stroke-dasharray:6 5;fill:none}
.pt{fill:#000}
</style>

<!-- Ejes -->
<line class="axis" x1="55" y1="285" x2="520" y2="285" marker-end="url(#arr)"/>
<line class="axis" x1="75" y1="305" x2="75" y2="35" marker-end="url(#arr)"/>

<!-- Líneas punteadas EXACTAS como en el PDF -->
<!-- y = 20: solo hasta x = 40 -->
<line class="dash" x1="75" y1="225" x2="155" y2="225"/>

<!-- y = 40: desde el eje y hasta x = 140 -->
<line class="dash" x1="75" y1="165" x2="455" y2="165"/>

<!-- y = 60: hasta x = 40 y, después del tramo superior sólido, desde x = 80 hasta x = 140 -->
<line class="dash" x1="75" y1="105" x2="155" y2="105"/>
<line class="dash" x1="275" y1="105" x2="455" y2="105"/>

<!-- x = 40: solo debajo del lado vertical sólido -->
<line class="dash" x1="155" y1="225" x2="155" y2="285"/>

<!-- x = 60, 80, 100, 120 y 140 -->
<line class="dash" x1="215" y1="105" x2="215" y2="285"/>
<line class="dash" x1="275" y1="105" x2="275" y2="285"/>
<line class="dash" x1="335" y1="105" x2="335" y2="285"/>
<line class="dash" x1="395" y1="105" x2="395" y2="285"/>
<line class="dash" x1="455" y1="105" x2="455" y2="285"/>

<!-- Contorno de la ventana -->
<path class="shape" d="M155 225 L155 105 L275 105 C350 108 415 155 455 225 L155 225 Z"/>

<!-- Puntos -->
<circle class="pt" cx="155" cy="225" r="5"/>
<circle class="pt" cx="155" cy="105" r="5"/>
<circle class="pt" cx="275" cy="105" r="5"/>
<circle class="pt" cx="455" cy="225" r="5"/>

<!-- Etiquetas -->
<g font-size="18" text-anchor="middle">
  <text x="155" y="309">40</text>
  <text x="215" y="309">60</text>
  <text x="275" y="309">80</text>
  <text x="335" y="309">100</text>
  <text x="395" y="309">120</text>
  <text x="455" y="309">140</text>
</g>
<g font-size="18" text-anchor="end">
  <text x="64" y="231">20</text>
  <text x="64" y="171">40</text>
  <text x="64" y="111">60</text>
</g>
<text x="526" y="285" font-size="20" font-family="Arial, Helvetica, sans-serif" dominant-baseline="middle">x</text>
<text x="75" y="20" font-size="20" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">y</text>
</svg>
