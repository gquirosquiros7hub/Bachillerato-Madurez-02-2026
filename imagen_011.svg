<line class="line" x1="256.9" y1="195" x2="785.0" y2="195"/>
<line class="tick" x1="256.9" y1="175" x2="256.9" y2="215"/>
<line class="tick" x1="785.0" y1="175" x2="785.0" y2="215"/>
<rect class="box" x="325.7" y="160" width="367.4" height="70" fill="white"/>
