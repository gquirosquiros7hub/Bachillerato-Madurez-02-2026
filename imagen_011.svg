<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500">
<rect width="920" height="500" fill="white"/>
<defs>
  <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="black"/>
  </pattern>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#000}
.line{stroke:#000;stroke-width:3;fill:none;stroke-linecap:square}
.tick{stroke:#000;stroke-width:2.5}
.box{stroke:#000;stroke-width:3}
</style>

<!-- Línea de referencia superior del Grupo 1 -->
<line class="line" x1="256.9" y1="78" x2="785.0" y2="78"/>
<line class="tick" x1="256.9" y1="66" x2="256.9" y2="90"/><line class="tick" x1="325.7" y1="66" x2="325.7" y2="90"/><line class="tick" x1="509.4" y1="66" x2="509.4" y2="90"/><line class="tick" x1="693.1" y1="66" x2="693.1" y2="90"/><line class="tick" x1="785.0" y1="66" x2="785.0" y2="90"/>

<!-- Números superiores -->
<g font-size="24" text-anchor="middle">
  <text x="256.9" y="42">19</text>
  <text x="325.7" y="42">22</text>
  <text x="509.4" y="42">30</text>
  <text x="693.1" y="42">38</text>
