<svg xmlns="http://www.w3.org/2000/svg" width="620" height="350" viewBox="0 0 620 350">
<rect width="100%" height="100%" fill="white"/>

<defs>
  <marker id="axis38" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#000"/>
  </marker>
</defs>

<style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#000}
  .axis{stroke:#000;stroke-width:2;fill:none}
  .fn{stroke:#000;stroke-width:2.5;fill:none;stroke-linejoin:round}
  .guide{stroke:#000;stroke-width:1.25;stroke-dasharray:6 5;fill:none}
  .pt{fill:#000}
</style>

<!-- Escala:
     x: 0,3,6,9,12,15,18 = 95,170,245,320,395,470,545
     y: 10,5,0,-5 = 65,130,195,260
-->

<!-- Ejes -->
<line class="axis" x1="95" y1="295" x2="95" y2="42" marker-end="url(#axis38)"/>
<line class="axis" x1="70" y1="195" x2="585" y2="195" marker-end="url(#axis38)"/>

<!-- Letras exactamente en la disposición del PDF -->
<text x="95" y="27" text-anchor="middle" font-size="20">t(x)</text>
<text x="596" y="201" font-size="20">x</text>

<!-- Guías horizontales -->
<line class="guide" x1="95" y1="65" x2="395" y2="65"/>
<line class="guide" x1="95" y1="130" x2="320" y2="130"/>
<line class="guide" x1="95" y1="260" x2="545" y2="260"/>

<!-- Guías verticales -->
<line class="guide" x1="245" y1="130" x2="245" y2="195"/>
<line class="guide" x1="320" y1="130" x2="320" y2="195"/>
<line class="guide" x1="395" y1="65" x2="395" y2="195"/>
<line class="guide" x1="545" y1="195" x2="545" y2="260"/>

<!-- Poligonal original -->
<polyline class="fn" points="
95,260
170,195
245,130
320,130
395,65
470,195
545,260"/>

<!-- Puntos -->
<circle class="pt" cx="95" cy="260" r="4.8"/>
<circle class="pt" cx="170" cy="195" r="4.8"/>
<circle class="pt" cx="245" cy="130" r="4.8"/>
<circle class="pt" cx="320" cy="130" r="4.8"/>
<circle class="pt" cx="395" cy="65" r="4.8"/>
<circle class="pt" cx="470" cy="195" r="4.8"/>
<circle class="pt" cx="545" cy="260" r="4.8"/>

<!-- Números del eje x: misma posición relativa del original -->
<text x="170" y="218" text-anchor="middle" font-size="18">3</text>
<text x="245" y="218" text-anchor="middle" font-size="18">6</text>
<text x="320" y="218" text-anchor="middle" font-size="18">9</text>
<text x="395" y="218" text-anchor="middle" font-size="18">12</text>
<text x="470" y="218" text-anchor="middle" font-size="18">15</text>

<!-- 18 va ARRIBA del eje x, alineado con su guía, como en el PDF -->
<text x="545" y="184" text-anchor="middle" font-size="18">18</text>

<!-- Números del eje vertical, ubicados a la izquierda como en el PDF -->
<text x="80" y="71" text-anchor="end" font-size="18">10</text>
<text x="80" y="136" text-anchor="end" font-size="18">5</text>
<text x="80" y="266" text-anchor="end" font-size="18">−5</text>
</svg>