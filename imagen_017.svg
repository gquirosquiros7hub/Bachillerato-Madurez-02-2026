<svg xmlns="http://www.w3.org/2000/svg" width="500" height="350" viewBox="0 0 500 350">
<rect width="100%" height="100%" fill="white"/>
<defs>
  <marker id="arr31" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#000"/>
  </marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#000}
.axis{stroke:#000;stroke-width:2.2;fill:none}
.shape{stroke:#000;stroke-width:2.6;fill:none}
.dash{stroke:#000;stroke-width:1.25;stroke-dasharray:6 5;fill:none}
.pt{fill:#000}
</style>

<!-- Ejes: origen (100,300); misma escala vertical y horizontal -->
<line class="axis" x1="70" y1="300" x2="450" y2="300" marker-end="url(#arr31)"/>
<line class="axis" x1="100" y1="320" x2="100" y2="35" marker-end="url(#arr31)"/>

<!-- Guías punteadas exactamente como en el PDF -->
<g class="dash">
  <line x1="100" y1="75" x2="220" y2="75"/>
  <line x1="100" y1="165" x2="340" y2="165"/>
  <line x1="100" y1="255" x2="220" y2="255"/>
  <line x1="220" y1="75" x2="220" y2="300"/>
  <line x1="340" y1="165" x2="340" y2="300"/>
</g>

<!-- Polígono ACDB -->
<polygon class="shape" points="220,255 340,165 220,75 100,165"/>

<!-- Puntos -->
<circle class="pt" cx="220" cy="255" r="4.5"/>
<circle class="pt" cx="340" cy="165" r="4.5"/>
<circle class="pt" cx="220" cy="75" r="4.5"/>
<circle class="pt" cx="100" cy="165" r="4.5"/>

<!-- Letras -->
<g font-size="19">
  <text x="207" y="61">D</text>
  <text x="350" y="174">C</text>
  <text x="228" y="274">A</text>
  <text x="104" y="194">B</text>
</g>

<!-- Valores de los ejes -->
<g font-size="17">
  <text x="84" y="261">1</text>
  <text x="84" y="171">3</text>
  <text x="84" y="81">5</text>
  <text x="214" y="323">2</text>
  <text x="334" y="323">4</text>
</g>

<!-- x, y en texto normal -->
<text x="458" y="300" font-size="20" dominant-baseline="middle">x</text>
<text x="100" y="21" font-size="20" text-anchor="middle">y</text>
</svg>