<svg xmlns="http://www.w3.org/2000/svg" width="540" height="500" viewBox="0 0 540 500">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="a35" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#000"/></marker></defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#000}
.grid{stroke:#555;stroke-width:1.1;stroke-dasharray:6 5}
.axis{stroke:#000;stroke-width:2}
.shape{stroke:#000;stroke-width:2.4;fill:none}
.pt{fill:#000}
</style>
<!-- origen (270,250), escala 50 -->
<g class="grid">
<line x1="70" y1="50" x2="470" y2="50"/><line x1="70" y1="100" x2="470" y2="100"/>
<line x1="70" y1="150" x2="470" y2="150"/><line x1="70" y1="200" x2="470" y2="200"/>
<line x1="70" y1="300" x2="470" y2="300"/><line x1="70" y1="350" x2="470" y2="350"/>
<line x1="70" y1="400" x2="470" y2="400"/><line x1="70" y1="450" x2="470" y2="450"/>
<line x1="70" y1="50" x2="70" y2="450"/><line x1="120" y1="50" x2="120" y2="450"/>
<line x1="170" y1="50" x2="170" y2="450"/><line x1="220" y1="50" x2="220" y2="450"/>
<line x1="320" y1="50" x2="320" y2="450"/><line x1="370" y1="50" x2="370" y2="450"/>
<line x1="420" y1="50" x2="420" y2="450"/><line x1="470" y1="50" x2="470" y2="450"/>
</g>
<line class="axis" x1="35" y1="250" x2="525" y2="250" marker-end="url(#a35)"/>
<line class="axis" x1="270" y1="475" x2="270" y2="30" marker-end="url(#a35)"/>
<!-- rombo -->
<polygon class="shape" points="370,50 420,100 370,150 320,100"/>
<g class="pt">
<circle cx="370" cy="50" r="4.7"/><circle cx="420" cy="100" r="4.7"/>
<circle cx="370" cy="150" r="4.7"/><circle cx="320" cy="100" r="4.7"/>
</g>
<text x="370" y="34" font-size="19" text-anchor="middle">P</text>
<!-- números x, como en PDF, sobre el eje -->
<g font-size="16">
<!-- eje x: todos a la izquierda de su línea vertical -->
<text x="66" y="242" text-anchor="end">−4</text>
<text x="116" y="242" text-anchor="end">−3</text>
<text x="166" y="242" text-anchor="end">−2</text>
<text x="216" y="242" text-anchor="end">−1</text>
<text x="316" y="242" text-anchor="end">1</text>
<text x="366" y="242" text-anchor="end">2</text>
<text x="416" y="242" text-anchor="end">3</text>
<text x="466" y="242" text-anchor="end">4</text>

<!-- eje y: todos por encima de su línea horizontal -->
<text x="260" y="195" text-anchor="end">1</text>
<text x="260" y="145" text-anchor="end">2</text>
<text x="260" y="95" text-anchor="end">3</text>
<text x="260" y="45" text-anchor="end">4</text>
<text x="260" y="295" text-anchor="end">−1</text>
<text x="260" y="345" text-anchor="end">−2</text>
<text x="260" y="395" text-anchor="end">−3</text>
<text x="260" y="445" text-anchor="end">−4</text>
</g>
<text x="531" y="250" font-size="20" font-family="Arial, Helvetica, sans-serif" dominant-baseline="middle">x</text>
<text x="270" y="20" font-size="20" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">y</text>
</svg>