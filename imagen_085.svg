<svg xmlns="http://www.w3.org/2000/svg" width="520" height="270" viewBox="0 0 520 270">
<rect width="100%" height="100%" fill="white"/>
<defs>
 <marker id="axisArrow" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
   <path d="M0,0 L8,4 L0,8 Z" fill="#000"/>
 </marker>
 <marker id="lineArrow" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto-start-reverse">
   <path d="M0,0 L8,4 L0,8 Z" fill="#000"/>
 </marker>
</defs>
<style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#000}
 .axis{stroke:#000;stroke-width:2.2;fill:none}
 .fn{stroke:#000;stroke-width:2.6;fill:none}
 .pt{fill:#000}
</style>

<line class="axis" x1="86" y1="145" x2="420" y2="145" marker-end="url(#axisArrow)"/>
<line class="axis" x1="165" y1="225" x2="165" y2="48" marker-end="url(#axisArrow)"/>
<text x="432" y="151" font-size="21">x</text>
<text x="165" y="34" text-anchor="middle" font-size="21">y</text>

<line class="fn" x1="105" y1="210" x2="392" y2="70"
 marker-start="url(#lineArrow)" marker-end="url(#lineArrow)"/>

<circle class="pt" cx="165" cy="181" r="5"/>
<circle class="pt" cx="275" cy="145" r="5"/>

<!-- Separación amplia: el −2 ya no invade la recta -->
<text x="138" y="158" text-anchor="end" font-size="20">−2</text>

<text x="270" y="133" text-anchor="middle" font-size="20">4</text>
<text x="350" y="78" font-size="20">f</text>
</svg>