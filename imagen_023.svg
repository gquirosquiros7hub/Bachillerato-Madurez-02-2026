<svg xmlns="http://www.w3.org/2000/svg" width="560" height="330" viewBox="0 0 560 330">
<rect width="100%" height="100%" fill="#fff"/>
<defs>
  <marker id="a47" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#000"/>
  </marker>
</defs>
<style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#000}
 .axis{stroke:#000;stroke-width:2.2;fill:none}
 .fn{stroke:#000;stroke-width:2.8;fill:none;stroke-linejoin:round;stroke-linecap:round}
 .dash{stroke:#000;stroke-width:1.25;stroke-dasharray:6 5;fill:none}
 .pt{fill:#000}
</style>

<!-- ejes -->
<line class="axis" x1="55" y1="165" x2="520" y2="165" marker-end="url(#a47)"/>
<line class="axis" x1="300" y1="290" x2="300" y2="28" marker-end="url(#a47)"/>
<text x="530" y="165" font-size="20" dominant-baseline="middle">x</text>
<text x="300" y="18" font-size="20" text-anchor="middle">y</text>

<!-- guías punteadas del PDF -->
<line class="dash" x1="158" y1="75" x2="300" y2="75"/>
<line class="dash" x1="158" y1="75" x2="158" y2="165"/>
<line class="dash" x1="430" y1="165" x2="430" y2="245"/>

<!-- función -->
<polyline class="fn" points="112,165 158,75 300,245 430,245"/>
<line class="fn" x1="430" y1="245" x2="493" y2="105" marker-end="url(#a47)"/>

<!-- puntos -->
<circle class="pt" cx="112" cy="165" r="4.5"/>
<circle class="pt" cx="158" cy="75" r="4.5"/>
<circle class="pt" cx="300" cy="245" r="4.5"/>
<circle class="pt" cx="430" cy="245" r="4.5"/>

<!-- etiquetas -->
<g font-size="18">
 <text x="112" y="190" text-anchor="middle">−4</text>
 <text x="158" y="190" text-anchor="middle">−3</text>
 <text x="430" y="157" text-anchor="middle">3</text>

 <!-- 2 a la derecha de la línea/eje, sin tocarla -->
 <text x="310" y="81">2</text>

 <text x="290" y="251" text-anchor="end">−2</text>
 <text x="478" y="91" font-size="21">f</text>
</g>
</svg>