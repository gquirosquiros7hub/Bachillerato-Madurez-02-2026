<svg xmlns="http://www.w3.org/2000/svg" width="620" height="430" viewBox="0 0 620 430">
<rect width="620" height="430" fill="white"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#000}
.axis{stroke:#000;stroke-width:2.6;fill:none}
.shape{stroke:#000;stroke-width:3;fill:none}
.guide{stroke:#000;stroke-width:2;stroke-dasharray:7 6;fill:none}
.dot{fill:#000}
</style>

<!-- Ejes -->
<line class="axis" x1="110" y1="365" x2="520" y2="365"/>
<polygon points="520,365 505,356 505,374" fill="black"/>
<line class="axis" x1="150" y1="390" x2="150" y2="55"/>
<polygon points="150,55 141,70 159,70" fill="black"/>
<text x="530" y="373" font-size="28">x</text>
<text x="135" y="45" font-size="28">y</text>

<!-- Escala: 1 unidad = 85 px. Centro O=(1,3) -->
<!-- x=1 -->
<text x="228" y="394" font-size="24">1</text>
<!-- y=2,3 -->
<text x="118" y="202" font-size="24">2</text>
<text x="118" y="117" font-size="24">3</text>

<!-- Guías punteadas x=1 y y=3 -->
<line class="guide" x1="235" y1="365" x2="235" y2="110"/>
<line class="guide" x1="150" y1="110" x2="235" y2="110"/>

<line class="guide" x1="150" y1="195" x2="235" y2="195"/>

<!-- Circunferencia C, centro (1,3), radio 1 -->
<circle class="shape" cx="235" cy="110" r="85"/>

<!-- Puntos indicados en el original -->
<circle class="dot" cx="235" cy="110" r="5.5"/>
<circle class="dot" cx="235" cy="195" r="5.5"/>

<!-- Etiquetas -->
<text x="245" y="121" font-size="25">O</text>
<text x="307" y="50" font-size="25">c</text>
</svg>