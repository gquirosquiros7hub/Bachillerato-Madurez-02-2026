<svg xmlns="http://www.w3.org/2000/svg" width="390" height="250" viewBox="0 0 390 250">
<rect width="100%" height="100%" fill="white"/>
<defs>
  <marker id="axC" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 Z" fill="#000"/>
  </marker>
  <marker id="lnC" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto-start-reverse">
    <path d="M0,0 L7,3.5 L0,7 Z" fill="#000"/>
  </marker>
</defs>
<style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#000}
 .axis{stroke:#000;stroke-width:2;fill:none}
 .fn{stroke:#000;stroke-width:2.55;fill:none}
 .pt{fill:#000}
</style>

<!-- Eje x: corto a la derecha del eje y, como en el PDF -->
<line class="axis" x1="130" y1="150" x2="310" y2="150" marker-end="url(#axC)"/>
<text x="322" y="156" font-size="20">x</text>

<!-- Eje y desplazado hacia la derecha -->
<line class="axis" x1="255" y1="205" x2="255" y2="45" marker-end="url(#axC)"/>
<text x="255" y="32" text-anchor="middle" font-size="20">y</text>

<!-- Recta creciente por (-4,0) y (0,2);
     sus flechas quedan separadas de las flechas de los ejes -->
<line class="fn" x1="115" y1="170" x2="330" y2="62.5"
      marker-start="url(#lnC)" marker-end="url(#lnC)"/>

<!-- Puntos -->
<circle class="pt" cx="155" cy="150" r="4.6"/>
<circle class="pt" cx="255" cy="100" r="4.6"/>

<!-- Etiquetas según el PDF -->
<text x="151" y="137" text-anchor="middle" font-size="18">−4</text>
<text x="244" y="95" text-anchor="end" font-size="18">2</text>
</svg>